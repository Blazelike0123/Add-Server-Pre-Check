plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = '0.1.0-alpha.1'
group = 'com.addserverprecheck'

def modArchiveName = 'Addserverprecheck_fabric_26.3'

base {
    archivesName = modArchiveName
}

repositories {
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "addserverprecheck" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

processResources {
    def modVersion = project.version

    inputs.property "version", modVersion

    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    archiveFileName = "${modArchiveName}_${project.version}.jar"

    from("LICENSE") {
        rename { "${it}_addserverprecheck" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }

    repositories {
    }
}